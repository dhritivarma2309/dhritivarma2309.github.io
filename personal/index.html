<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Keeps this page out of Google until launch. Remove all of these lines to go live in search. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Personal</title>
  <meta name="description" content="What I'm listening to, albums I've rated, and notes on music I love.">
  <meta property="og:title" content="Personal">
  <meta property="og:description" content="What I'm listening to, albums I've rated, and notes on music I love.">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Caveat+Brush&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/site.css?v=202610130900">
  <link rel="stylesheet" href="../assets/css/music.css?v=202610130910">
</head>
<body>

  <!-- Reusable icon sprites -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-listen" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M7 9.5c3.5-1.2 7-.9 10 .8M7.6 12.6c2.8-.9 5.6-.6 8 .7M8.3 15.4c2.1-.6 4.2-.4 6 .5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-arrow-l" viewBox="0 0 24 24"><path d="M14.5 6 8.5 12l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-arrow-r" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-star" viewBox="0 0 40 40"><path d="M20 3.5l4.6 10.6 11.4 1-8.7 7.6 2.7 11.2L20 28l-10 5.9 2.7-11.2L4 15.1l11.4-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-note" viewBox="0 0 44 50"><path d="M14 40V10l24-6v30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><ellipse cx="9" cy="40" rx="6" ry="4.5" fill="none" stroke="currentColor" stroke-width="2.2"/><ellipse cx="33" cy="34" rx="6" ry="4.5" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
    </defs>
  </svg>

  <header class="wrap site-header">
    <nav class="nav" aria-label="Main">
      <a href="../">Home</a>
      <a href="../projects/">Projects</a>
      <a href="../personal/" aria-current="page">Personal</a>
    </nav>
    <div class="header-links">
      <a class="btn" href="https://github.com/" data-link="github" target="_blank" rel="noopener">GitHub Repo</a>
      <a class="btn" href="https://www.linkedin.com/" data-link="linkedin" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </header>

  <main class="wrap">
    <a class="back-link" href="../">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      Home
    </a>

    <!-- page doodles -->
    <svg class="doodle doodle--red hide-sm" style="left:-70px; top:300px; width:44px" viewBox="0 0 44 50" aria-hidden="true"><use href="#i-note"/></svg>
    <svg class="doodle hide-md" style="right:-40px; top:70px; width:96px; opacity:.55" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="42" fill="none" stroke="#e6ddd3" stroke-width="10"/>
      <circle cx="50" cy="50" r="42" fill="none" stroke="#d8cfc4" stroke-width="1.5"/>
      <circle cx="50" cy="50" r="33" fill="none" stroke="#d8cfc4" stroke-width="1.5"/>
    </svg>

    <!-- 01 · Hero -->
    <section class="hero" aria-labelledby="page-title">
      <div>
        <h1 class="sr-only" id="page-title">Personal</h1>
        <p class="lede" data-bind="intro"></p>
      </div>

    </section>

    <!-- 04 · Album ratings -->
    <section class="section" id="albums" aria-labelledby="albums-title">
      <svg class="doodle doodle--red hide-md" style="left:-80px; top:340px; width:42px" aria-hidden="true"><use href="#i-star"/></svg>
      <div class="section-head section-head--turntable">
        <svg class="icon turntable" viewBox="0 0 160 130" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="A turntable playing a record">
                    <!-- plinth -->
          <path d="M8 3 H152 C156 3 158 5 158 9 L157 120 C157 124 155 126 151 126 H9 C5 126 3 124 3 120 L2 9 C2 5 4 3 8 3 Z" fill="#fff"/>
          <!-- platter -->
          <circle cx="60" cy="60" r="51" stroke-width="1.6"/>
          <!-- record (spins) -->
          <g class="record">
            <circle cx="60" cy="60" r="46" fill="#1f2a44" stroke="none"/>
            <g stroke="#fff" stroke-opacity=".16" stroke-width="1"><circle cx="60" cy="60" r="41"/><circle cx="60" cy="60" r="36"/><circle cx="60" cy="60" r="30"/><circle cx="60" cy="60" r="24"/></g>
            <path d="M33 33 A38 38 0 0 1 60 22" stroke="#fff" stroke-opacity=".45" stroke-width="3"/>
            <path d="M87 87 A38 38 0 0 1 60 98" stroke="#fff" stroke-opacity=".25" stroke-width="3"/>
            <circle cx="60" cy="60" r="15" fill="#c0352b" stroke="none"/>
            <circle cx="60" cy="60" r="9" stroke="#fcfcf9" stroke-opacity=".6" stroke-width="1"/>
            <path d="M52 55 h9 M52 59 h6" stroke="#fcfcf9" stroke-width="1.4"/>
            <circle cx="60" cy="60" r="15" stroke="#1f2a44" stroke-width="1"/>
            <circle cx="60" cy="60" r="2" fill="#fcfcf9" stroke="none"/>
          </g>
          <!-- tonearm (swings in) -->
          <g class="arm">
            <circle cx="134" cy="22" r="9" fill="#fff"/>
            <circle cx="134" cy="22" r="3.5" fill="currentColor" stroke="none"/>
            <path d="M134 22 L129 76 Q127 86 117 88 L98 87"/>
            <path d="M99 82 L87 81 L86 91 L98 92 Z" fill="#fff"/>
          </g>
          <!-- controls -->
          <circle cx="138" cy="106" r="8" fill="#fff"/><path d="M138 101v5"/>
          <rect x="28" y="113" width="14" height="6" rx="2"/><rect x="47" y="113" width="14" height="6" rx="2"/>
          <circle class="power" cx="16" cy="116" r="3" stroke="none"/>
          <!-- notes drifting off the record -->
          <g class="notes" stroke-width="1.6">
            <g><path d="M104 30v-10l7-2v9"/><ellipse cx="102" cy="30" rx="2.6" ry="2"/><ellipse cx="109" cy="27" rx="2.6" ry="2"/></g>
            <g><path d="M92 18v-10c3 1 5 3 5 6"/><ellipse cx="90" cy="18" rx="2.6" ry="2"/></g>
            <g><path d="M114 44v-9l6-2v8"/><ellipse cx="112" cy="44" rx="2.4" ry="1.9"/><ellipse cx="118" cy="41" rx="2.4" ry="1.9"/></g>
          </g>
        </svg>
        <h2 class="display" id="albums-title">Album Ratings</h2>
        <p class="lede" data-bind="albumsIntro"></p>
      </div>
      <div class="albums" data-slot="albums" data-limit="8"></div>
      <p class="see-all" data-slot="see-all" hidden><a class="btn" href="albums/"><span>See all album ratings</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></p>
      <div class="paper rubric" data-slot="rubric" aria-label="Rating rubric"></div>
      <div class="paper rubric story" data-slot="story"></div>
    </section>

    <!-- 02 + 03 -->
    <div class="hero-art queue-art" aria-hidden="true">
      <svg viewBox="30 -8 450 264" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <!-- floating notes -->
        <g stroke="#c0352b">
          <g class="float-note"><path d="M214 72V36l20-6v30" /><ellipse cx="209" cy="73" rx="6" ry="4.5"/><ellipse cx="229" cy="61" rx="6" ry="4.5"/></g>
          <g class="float-note"><path d="M262 30V0c6 2 12 6 12 14" /><ellipse cx="257" cy="31" rx="6" ry="4.5"/></g>
          <path d="M188 52c2-6 8-6 10 0" class="float-note"/>
        </g>

        <!-- body -->
        <path d="M42 134 C 40 130, 44 127, 50 127 L 352 125 C 358 125, 360 129, 360 134 L 362 224 C 362 229, 358 231, 352 231 L 50 233 C 44 233, 42 230, 42 225 Z" fill="#fff"/>
        <path d="M70 233 l-3 16 M 336 231 l3 16"/>
        <circle cx="92" cy="176" r="10"/><circle cx="124" cy="176" r="10"/>
        <path d="M258 168 h 76 M 258 186 h 58"/>

        <!-- vinyl (grooves animate) -->
        <g class="vinyl">
          <ellipse cx="200" cy="124" rx="108" ry="25" fill="#fff"/>
          <ellipse class="groove" cx="200" cy="124" rx="86" ry="19"/>
          <ellipse class="groove g2" cx="200" cy="124" rx="62" ry="13.5"/>
          <ellipse cx="200" cy="124" rx="30" ry="7"/>
          <ellipse cx="200" cy="124" rx="11" ry="2.6" fill="currentColor"/>
        </g>

        <!-- tonearm -->
        <path d="M330 84 c0-8 10-8 10 0 v8 l-18 24 l-60 12"/>

        <!-- headphones -->
        <path d="M378 200 C 372 130, 470 130, 462 200"/>
        <rect x="368" y="196" width="18" height="40" rx="8" fill="#fff"/>
        <rect x="454" y="196" width="18" height="40" rx="8" fill="#fff"/>
        <path d="M377 206v20 M463 206v20" stroke-width="1.6"/>
      </svg>
    </div>

    <!-- Add to Queue: Playlists + Heavy Rotation -->
    <h2 class="display group-title" id="add-to-queue">Add To Queue</h2>

    <div class="pair">

      <!-- 02 · Discover New -->
      <section class="paper card tape" id="discover" aria-labelledby="discover-title" data-card style="--tape-rot:-2deg">
        <svg class="clip" viewBox="0 0 22 56" fill="none" stroke="#7d8798" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 20V8a5 5 0 0 1 10 0v34a8 8 0 0 1-16 0V16"/></svg>
        <div class="card-head">
          <svg class="icon radio" viewBox="0 0 80 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="A radio playing">
            <!-- antenna sways -->
            <g class="antenna"><path d="M26 20 L13 5"/><circle cx="12" cy="4" r="2.2" fill="#c0352b" stroke="none"/></g>
            <!-- body -->
            <rect x="5" y="20" width="58" height="38" rx="6" fill="#fff"/>
            <path d="M44 20 v-4 h12 v4"/>
            <!-- speaker pulses with the beat -->
            <circle cx="22" cy="39" r="11"/>
            <circle class="cone" cx="22" cy="39" r="5" fill="#1f2a44" stroke="none"/>
            <!-- tuning dial: needle drifts across stations -->
            <rect x="39" y="27" width="18" height="9" rx="2"/>
            <path class="needle" d="M44 28.5 v6" stroke="#c0352b" stroke-width="2"/>
            <circle cx="43" cy="47" r="3"/><circle cx="53" cy="47" r="3"/>
            <!-- sound waves -->
            <g class="waves" stroke="#c0352b" stroke-width="2">
              <path d="M68 31 q4 8 0 16"/>
              <path d="M73 27 q7 12 0 24"/>
            </g>
          </svg>
          <h3 class="kicker" id="discover-title">Playlists</h3>
        </div>

        <p class="card-intro" data-bind="discover.intro"></p>

        <!-- theme carousel (outer) -->
        <div class="theme-bar" role="group" aria-label="Themes">
          <button class="hand-arrow hand-arrow--prev" data-theme-prev aria-label="Previous theme"><svg viewBox="0 0 40 22" width="36" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12.5 C 10 10.5, 18 12.5, 26 10.8 S 33 11.2, 35.5 10.6"/><path d="M28.5 4.5 C 31 7, 33.5 9, 36 10.8 C 33 12.5, 30.5 14.8, 28.8 17.5"/></svg></button>
          <div class="theme-label" aria-live="polite">
            <span class="theme-name" data-theme-name></span>
            <span class="theme-blurb" data-theme-blurb></span>
          </div>
          <button class="hand-arrow" data-theme-next aria-label="Next theme"><svg viewBox="0 0 40 22" width="36" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12.5 C 10 10.5, 18 12.5, 26 10.8 S 33 11.2, 35.5 10.6"/><path d="M28.5 4.5 C 31 7, 33.5 9, 36 10.8 C 33 12.5, 30.5 14.8, 28.8 17.5"/></svg></button>
        </div>

        <div class="carousel" aria-roledescription="carousel">
          <div class="slides"><div class="track" data-slot="discover"></div></div>
          <div class="player" data-player></div>
          <div class="carousel-nav">
            <button class="hand-arrow hand-arrow--prev" data-prev aria-label="Previous song"><svg viewBox="0 0 40 22" width="36" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12.5 C 10 10.5, 18 12.5, 26 10.8 S 33 11.2, 35.5 10.6"/><path d="M28.5 4.5 C 31 7, 33.5 9, 36 10.8 C 33 12.5, 30.5 14.8, 28.8 17.5"/></svg></button>
            <div class="dots" data-slot="dots" role="tablist" aria-label="Choose song"></div>
            <button class="hand-arrow" data-next aria-label="Next song"><svg viewBox="0 0 40 22" width="36" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12.5 C 10 10.5, 18 12.5, 26 10.8 S 33 11.2, 35.5 10.6"/><path d="M28.5 4.5 C 31 7, 33.5 9, 36 10.8 C 33 12.5, 30.5 14.8, 28.8 17.5"/></svg></button>
          </div>
        </div>
      </section>

      <!-- 03 · On rotation -->
      <section class="paper card tape" id="rotation" aria-labelledby="rotation-title" data-card style="--tape-rot:1deg">
        <svg class="clip" viewBox="0 0 22 56" fill="none" stroke="#7d8798" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 20V8a5 5 0 0 1 10 0v34a8 8 0 0 1-16 0V16"/></svg>
        <div class="card-head">
          <svg class="icon repeat" viewBox="0 0 80 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="A repeat symbol looping around a spinning record">
            <!-- repeat loop (turns a half circle every few seconds and lands in the same pose) -->
            <g class="loop">
              <path d="M13 36 V23 C13 15 18 10 26 10 H58"/>
              <path d="M51 3.5 L59.5 10 L51 16.5"/>
              <path d="M67 28 V41 C67 49 62 54 54 54 H22"/>
              <path d="M29 47.5 L20.5 54 L29 60.5"/>
            </g>
            <!-- little record in the middle -->
            <g class="disc">
              <circle cx="40" cy="32" r="11" fill="#1f2a44" stroke="none"/>
              <circle cx="40" cy="32" r="7.5" stroke="#fff" stroke-opacity=".25" stroke-width="1"/>
              <path d="M32.5 26 A9.5 9.5 0 0 1 40 22.5" stroke="#fff" stroke-opacity=".5" stroke-width="1.6"/>
              <circle cx="40" cy="32" r="3.6" fill="#c0352b" stroke="none"/>
              <circle cx="40" cy="32" r="1" fill="#fcfcf9" stroke="none"/>
            </g>
          </svg>
          <h3 class="kicker" id="rotation-title">Heavy Rotation</h3>
        </div>
        <p class="card-intro" data-bind="onRotation.intro"></p>
        <ol class="rotation-list" data-slot="rotation"></ol>
        <div class="player" data-player></div>
      </section>
    </div>

    <!-- Thoughts: blog posts -->
    <section class="section" id="thoughts" aria-labelledby="thoughts-title">
      <div class="liner-head">
        <div class="section-head">
          <svg class="icon liner" viewBox="10 0 180 195" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="A notebook being written in">
            <!-- notebook -->
            <rect x="30" y="24" width="138" height="160" rx="5" fill="#fff"/>
            <path d="M44 66 H158" stroke="#d9dde5" stroke-width="1"/>
            <path d="M44 88 H158" stroke="#d9dde5" stroke-width="1"/>
            <path d="M44 110 H158" stroke="#d9dde5" stroke-width="1"/>
            <path d="M44 132 H158" stroke="#d9dde5" stroke-width="1"/>
            <path d="M44 154 H158" stroke="#d9dde5" stroke-width="1"/>
            <g stroke-width="2"><path d="M52 30 v-12 a4 4 0 0 1 8 0 v4"/> <path d="M70 30 v-12 a4 4 0 0 1 8 0 v4"/> <path d="M88 30 v-12 a4 4 0 0 1 8 0 v4"/> <path d="M106 30 v-12 a4 4 0 0 1 8 0 v4"/> <path d="M124 30 v-12 a4 4 0 0 1 8 0 v4"/> <path d="M142 30 v-12 a4 4 0 0 1 8 0 v4"/></g>
            <!-- handwriting, written line by line -->
            <g class="writing" stroke-width="1.8">
              <path class="ink ink0" d="M48 62 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0 c2 -5 4 -5 6 0 s3 3 2 0" pathLength="100"/>
              <path class="ink ink1" d="M48 84 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0" pathLength="100"/>
              <path class="ink ink2" d="M48 106 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0" pathLength="100"/>
              <path class="ink ink3" d="M48 128 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0" pathLength="100"/>
              <path class="ink ink4" d="M48 150 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0 c2 -5 4 -5 6 0 s3 3 2 0 c2 -3 4 -3 6 0 s3 3 2 0" pathLength="100"/>
            </g>
            <g class="doodle-note" stroke="#c0352b" stroke-width="1.8"><path d="M176 52 a12 12 0 1 0 -18 10 v6 h12 v-6 a12 12 0 0 0 6 -10 z"/><path d="M160 74 h8"/><path d="M164 32 v-6 M182 40 l5 -4 M146 40 l-5 -4"/></g>
            <!-- pencil (tip at 0,0) -->
            <g class="pencil">
              <g transform="rotate(-35)">
                <path d="M0 0 l5 -12 h6 l5 12 z" fill="#f2d5c6" stroke-width="1.6" transform="translate(-8 0) rotate(180 8 0)"/>
                <rect x="-6" y="-58" width="12" height="46" rx="2" fill="#f4d878" stroke-width="1.6"/>
                <rect x="-6" y="-66" width="12" height="9" rx="2" fill="#c0352b" stroke-width="1.6"/>
                <path d="M-1.6 -3.5 L0 0 L1.6 -3.5 z" fill="currentColor" stroke="none"/>
              </g>
            </g>
          </svg>
          <h2 class="display" id="thoughts-title">Thoughts</h2>
          <p class="lede" data-bind="thoughtsIntro"></p>
        </div>
      </div>
      <div class="articles" data-slot="thoughts"></div>
    </section>

  </main>

  <footer class="wrap site-footer">
    <div class="inner">
      <p class="credits">Album artwork and audio via <a href="https://www.spotify.com" target="_blank" rel="noopener">Spotify</a>. All rights belong to the respective artists and labels.</p>

      </nav>
    </div>
  </footer>
