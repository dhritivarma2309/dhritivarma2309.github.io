<body>

  <!-- Reusable icon sprites -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">

        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M7 9.5c3.5-1.2 7-.9 10 .8M7.6 12.6c2.8-.9 5.6-.6 8 .7M8.3 15.4c2.1-.6 4.2-.4 6 .5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>

      <symbol id="i-star" viewBox="0 0 40 40"><path d="M20 3.5l4.6 10.6 11.4 1-8.7 7.6 2.7 11.2L20 28l-10 5.9 2.7-11.2L4 15.1l11.4-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-note" viewBox="0 0 44 50"><path d="M14 40V10l24-6v30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><ellipse cx="9" cy="40" rx="6" ry="4.5" fill="none" stroke="currentColor" stroke-width="2.2"/><ellipse cx="33" cy="34" rx="6" ry="4.5" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
    </defs>
  </svg>

    <nav class="nav" aria-label="Main">
      <a href="../">Home</a>
      <a href="../projects/">Projects</a>
      <a href="../personal/" aria-current="page">Personal</a>
    </nav>
    <div class="header-links">
      <a class="btn" href="https://github.com/" data-link="github" target="_blank" rel="noopener">GitHub Repo</a>
      <a class="btn" href="https://www.linkedin.com/" data-link="linkedin" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </header>

  <main class="wrap">
    <a class="back-link" href="../">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      Home

    <!-- page doodles -->
    <svg class="doodle doodle--red hide-sm" style="left:-70px; top:300px; width:44px" viewBox="0 0 44 50" aria-hidden="true"><use href="#i-note"/></svg>
    <svg class="doodle hide-md" style="right:-40px; top:70px; width:96px; opacity:.55" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="42" fill="none" stroke="#e6ddd3" stroke-width="10"/>
      <circle cx="50" cy="50" r="42" fill="none" stroke="#d8cfc4" stroke-width="1.5"/>
      <circle cx="50" cy="50" r="33" fill="none" stroke="#d8cfc4" stroke-width="1.5"/>
    </svg>

    <!-- 01 · Hero -->
    <section class="hero" aria-labelledby="page-title">
      <div>
        <h1 class="sr-only" id="page-title">Personal</h1>
        <p class="lede" data-bind="intro"></p>
      </div>

    </section>

    <!-- 04 · Album ratings -->
    <section class="section" id="albums" aria-labelledby="albums-title">
      <svg class="doodle doodle--red hide-md" style="left:-80px; top:340px; width:42px" aria-hidden="true"><use href="#i-star"/></svg>
      <div class="section-head section-head--turntable">

          <g class="sc-sleeve">
            <rect x="128" y="40" width="92" height="92" rx="3" fill="#f2d5c6"/>
            <path d="M138 108 c10 -10 18 -10 28 0 s18 10 28 0 s12 -6 18 -2" stroke="#1f2a44" stroke-width="2"/>
            <circle cx="196" cy="64" r="10" fill="#c0352b" stroke="none"/>
          </g>
          <!-- scorecard on a clipboard -->
          <rect x="30" y="24" width="124" height="160" rx="7" fill="#fff"/>
          <rect x="66" y="15" width="52" height="18" rx="5" fill="#f4d878"/>
          <path d="M44 38 h96" stroke="#c0352b" stroke-width="1.8"/>
          <rect x="46" y="50" width="20" height="20" rx="3" fill="#d3e2ef" stroke-width="1.6"/>
          <path d="M76 56 h40" stroke="#1f2a44" stroke-width="2"/>
          <path d="M76 65 h26" stroke="#7d8798" stroke-width="1.6"/>
          <rect x="46" y="82" width="20" height="20" rx="3" fill="#f2d5c6" stroke-width="1.6"/>
          <path d="M76 88 h40" stroke="#1f2a44" stroke-width="2"/>
          <path d="M76 97 h26" stroke="#7d8798" stroke-width="1.6"/>
          <rect x="46" y="114" width="20" height="20" rx="3" fill="#dfe8cf" stroke-width="1.6"/>
          <path d="M76 120 h40" stroke="#1f2a44" stroke-width="2"/>
          <path d="M76 129 h26" stroke="#7d8798" stroke-width="1.6"/>
          <rect x="46" y="146" width="20" height="20" rx="3" fill="#e7d9ef" stroke-width="1.6"/>
          <path d="M76 152 h40" stroke="#1f2a44" stroke-width="2"/>
          <path d="M76 161 h26" stroke="#7d8798" stroke-width="1.6"/>
          <!-- red-pen marks, written one by one -->
          <g class="sc-marks" stroke="#c0352b" stroke-width="2.4" transform="translate(-6 0)">
          <path class="mk mk0" d="M134 58 l5 5 l10 -12" pathLength="100"/>
          <path class="mk mk1" d="M141 96 c-6 -5 -9 -9 -5 -12 c3 -2 5 0 5 2 c0 -2 2 -4 5 -2 c4 3 1 7 -5 12 z" pathLength="100"/>
          <path class="mk mk2" d="M134 122 l5 5 l10 -12" pathLength="100"/>

          </g>
        </svg>
        <h2 class="display" id="albums-title">Album Ratings</h2>
        <p class="lede" data-bind="albumsIntro"></p>
      </div>
      <div class="albums" data-slot="albums" data-limit="8"></div>
      <p class="see-all" data-slot="see-all" hidden><a class="btn" href="albums/"><span>See all album ratings</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></p>
      <div class="paper rubric" data-slot="rubric" aria-label="Rating rubric"></div>
      <div class="paper rubric story" data-slot="story"></div>
    </section>

    <!-- 02 + 03 -->
    <div class="hero-art queue-art" aria-hidden="true">
      <!-- a record on repeat: the vinyl spins inside a slowly turning repeat loop -->
      <svg viewBox="0 0 240 205" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <g stroke="#c0352b" stroke-width="2.2">
          <g class="float-note"><path d="M206 40V14l14-4v22"/><ellipse cx="202" cy="41" rx="5" ry="3.8"/><ellipse cx="216" cy="33" rx="5" ry="3.8"/></g>
          <g class="float-note"><path d="M28 34V12c5 1 9 4 9 10"/><ellipse cx="24" cy="35" rx="5" ry="3.8"/></g>
        </g>
        <g class="hr-loop">
          <path d="M41.1 73.3 A84 84 0 0 1 191.2 57.5"/><path d="M191.3 44.4 L191.2 57.5 L179.5 51.9"/>
          <path d="M198.9 130.7 A84 84 0 0 1 48.8 146.5"/><path d="M48.7 159.6 L48.8 146.5 L60.5 152.1"/>
        </g>
        <g class="hr-vinyl">
          <circle cx="120" cy="102" r="60" fill="#1f2a44" stroke="none"/>
          <g stroke="#fff" stroke-opacity=".18" stroke-width="1"><circle cx="120" cy="102" r="51"/><circle cx="120" cy="102" r="43"/><circle cx="120" cy="102" r="35"/></g>
          <path d="M76 78 A50 50 0 0 1 100 56" stroke="#fff" stroke-opacity=".5" stroke-width="3"/>
          <circle cx="120" cy="102" r="17" fill="#c0352b" stroke="none"/>
          <path d="M112 98 h16" stroke="#fcfcf9" stroke-opacity=".7" stroke-width="1.6"/>
          <circle cx="120" cy="102" r="2.6" fill="#fcfcf9" stroke="none"/>
        </g>
      </svg>
    </div>

    <!-- Heavy Rotation: the songs on repeat, as rows like Album Ratings -->
    <h2 class="display group-title" id="heavy-rotation">Heavy Rotation</h2>
    <p class="lede group-lede" data-bind="onRotation.intro"></p>
    <div class="albums album-rows song-rows" data-slot="rotation-rows" aria-labelledby="heavy-rotation"></div>

    <!-- Thoughts: blog posts -->
    <section class="section" id="thoughts" aria-labelledby="thoughts-title">
      <div class="liner-head">
        <div class="section-head">
          <svg class="icon liner" viewBox="10 0 180 195" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="A notebook being written in">
            <!-- notebook -->
            <rect x="30" y="24" width="138" height="160" rx="5" fill="#fff"/>
            <path d="M44 66 H158" stroke="#d9dde5" stroke-width="1"/>
            <path d="M44 88 H158" stroke="#d9dde5" stroke-width="1"/>
            <path d="M44 110 H158" stroke="#d9dde5" stroke-width="1"/>
            <path d="M44 132 H158" stroke="#d9dde5" stroke-width="1"/>
            <path d="M44 154 H158" stroke="#d9dde5" stroke-width="1"/>

            <g class="doodle-note" stroke="#c0352b" stroke-width="1.8"><path d="M176 52 a12 12 0 1 0 -18 10 v6 h12 v-6 a12 12 0 0 0 6 -10 z"/><path d="M160 74 h8"/><path d="M164 32 v-6 M182 40 l5 -4 M146 40 l-5 -4"/></g>
